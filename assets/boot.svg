<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Boot log: Nicolas Becas, Computer Engineer, open to work">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;white-space:pre}
.prompt{fill:#3fb950;font-weight:700}
.log{fill:#9da7b3}
.status{fill:#58a6ff;font-weight:700}
.l{animation:show .01s backwards}
.cur{fill:#3fb950;animation:show .01s backwards,blink 1s step-end infinite}
@keyframes show{from{opacity:0}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.l,.cur{animation:none}}
</style>
<rect x="0.5" y="0.5" width="899" height="289" rx="12" fill="#0d1117" stroke="#30363d"/>
<rect x="0.5" y="0.5" width="899" height="34" rx="12" fill="#161b22"/>
<rect x="0.5" y="24" width="899" height="11" fill="#161b22"/>
<circle cx="22" cy="18" r="5" fill="#ff5f56"/><circle cx="40" cy="18" r="5" fill="#ffbd2e"/><circle cx="58" cy="18" r="5" fill="#27c93f"/>
<text x="450" y="22" text-anchor="middle" style="font-size:12px;fill:#7d8590">nicolas-becas — boot.log</text>
<text x="30" y="62" class="prompt l" style="animation-delay:0.40s">nicolas@becas:~$ boot --profile</text>
